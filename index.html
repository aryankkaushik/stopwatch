<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container text-center mt-2">
        <h1>STOP WATCH</h1>
        <div class="btn-group mt-2" role="group" aria-label="Basic mixed styles example">
            <button type="button" class="btn btn-danger" id="btn1" onclick="start()">Start</button>
            <button type="button" class="btn btn-warning" id="btn2" onclick="pause()">Pause/Resume</button>
            <button type="button" class="btn btn-success" id="btn3" onclick="clear_timer()">clear</button>
        </div>
        <br><br>
        <div id="result">
            <h1>00:00</h1>
        </div>


    </div>

    <script src="app.js"></script>
    
</body>
</html>
